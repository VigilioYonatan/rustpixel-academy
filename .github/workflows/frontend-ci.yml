name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit
      - run: npm run content:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run senior:check
      - run: npm run senior:demo-check
      - run: npm run senior:labs-check
      - run: npm run vigilio:check
      - run: npm run build
      - run: npm run security:scan
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: rustpixel-dist
          path: dist/

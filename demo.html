*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font-ui)}button,input,select,textarea{font:inherit}a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{opacity:.6;cursor:not-allowed}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px clamp(16px,3vw,40px);box-shadow:0 6px 20px var(--shadow)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:22px;font-weight:900}.brand img{width:48px;height:48px;object-fit:contain}.brand b{color:var(--forge)}.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.nav a,.nav button,.sidebar a{padding:9px 12px;border-radius:10px;border:1px solid transparent;text-decoration:none;background:none;color:var(--text);font-weight:650}.nav a:hover,.nav button:hover,.sidebar a:hover,.nav .selected,.sidebar .selected{background:var(--surface-2);border-color:var(--border)}.app-grid{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{padding:25px 16px;border-right:1px solid var(--border);background:var(--surface);min-height:calc(100vh - 76px)}.sidebar a{display:block;margin-bottom:8px}.content{padding:24px clamp(16px,3vw,40px) 70px;min-width:0;max-width:1400px}.hero{min-height:270px;position:relative;background:linear-gradient(95deg,rgba(12,20,36,.88),rgba(20,20,37,.4)),url('public/assets/backgrounds/forge-night.png') center/cover;border:2px solid var(--copper);border-radius:20px;display:flex;align-items:center;gap:20px;padding:32px;color:#fff;overflow:hidden}.hero h1{font-size:clamp(29px,4vw,58px);line-height:1.05;margin:0 0 8px;letter-spacing:-.055em}.hero .mascot{height:230px;max-width:34%;object-fit:contain;filter:drop-shadow(0 12px 8px #0008)}.hero p{font-size:18px;max-width:670px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid var(--border);border-radius:10px;padding:10px 15px;background:var(--surface-2);color:var(--text);text-decoration:none;font-weight:750;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn-gold{background:var(--senior);color:#171b23;border-color:#aa812e}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}.sectionhead h2{margin:0;font-size:24px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:18px;min-width:0}.card h3{margin:0 0 8px;font-size:18px}.card p{margin:5px 0;color:var(--muted)}.card-icon{font-size:28px;margin-bottom:12px}.small{font-size:13px;color:var(--muted)}.eyebrow{color:var(--senior);font-weight:900;letter-spacing:.15em;text-transform:uppercase;font-size:12px}.meter{width:100%;height:10px;border-radius:99px;background:var(--border);overflow:hidden;margin:10px 0}.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--forge),var(--senior));border-radius:99px}.tag{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}.module{width:100%;text-align:left;color:var(--text);cursor:pointer}.module:hover,.clickable:hover{border-color:var(--forge);transform:translateY(-1px)}.module strong{display:block}.lesson-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.codebox{background:#0b1423;color:#d6e4f5;border:1px solid #4a6586;border-radius:12px;overflow:hid <div style="position:fixed;z-index:9999;right:12px;bottom:12px;background:#1a2434;border:2px solid #f18a43;padding:9px 14px;border-radius:9px;color:white;font:600 14px system-ui"><a style="color:#ffd08c" href="senior-demo.html">👑 Abrir Senior Mode interactivo (18 desafíos) →</a></div><header class="topbar" id="header"></header><div class="app-grid"><aside class="sidebar" id="sidebar"></aside><main id="main" class="content" tabindex="-1"></main></div><div id="status" role="status" style="display:none;position:fixed;bottom:20px;right:20px;z-index:90;background:var(--surface);border:2px solid var(--forge);border-radius:9px;padding:12px;max-width:300px"></div><script>const modules=[{"id":"B01","slug":"introducci-n-a-rust","title":"Introducción a Rust","level":"basic","topics":["Rustup","rustc y tu primer programa","Cargo","Estructura de un proyecto"],"lessons":[{"id":"B01-L01","title":"Rustup","explanation":"En «Introducción a Rust», estudia rustup y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica rustup con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B01-L02","title":"rustc y tu primer programa","explanation":"En «Introducción a Rust», estudia rustc y tu primer programa y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica rustc y tu primer programa con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B01-L03","title":"Cargo","explanation":"En «Introducción a Rust», estudia cargo y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica cargo con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B01-L04","title":"Estructura de un proyecto","explanation":"En «Introducción a Rust», estudia estructura de un proyecto y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica estructura de un proyecto con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"fn main() { println!(\"¡Hola, Ferris!\"); }","finalChallenge":"Resuelve un ejercicio de introducción a rust y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B02","slug":"variables-y-tipos","title":"Variables y tipos","level":"basic","topics":["let y mut","Shadowing","Números y bool","Conversiones explícitas"],"lessons":[{"id":"B02-L01","title":"let y mut","explanation":"En «Variables y tipos», estudia let y mut y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica let y mut con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B02-L02","title":"Shadowing","explanation":"En «Variables y tipos», estudia shadowing y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica shadowing con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B02-L03","title":"Números y bool","explanation":"En «Variables y tipos», estudia números y bool y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica números y bool con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B02-L04","title":"Conversiones explícitas","explanation":"En «Variables y tipos», estudia conversiones explícitas y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica conversiones explícitas con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"let mut edad = 20; edad += 1; println!(\"{edad}\");","finalChallenge":"Resuelve un ejercicio de variables y tipos y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B03","slug":"control-de-flujo","title":"Control de flujo","level":"basic","topics":["if como expresión","loop y break","while y for","Patrones en condiciones"],"lessons":[{"id":"B03-L01","title":"if como expresión","explanation":"En «Control de flujo», estudia if como expresión y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica if como expresión con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B03-L02","title":"loop y break","explanation":"En «Control de flujo», estudia loop y break y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica loop y break con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B03-L03","title":"while y for","explanation":"En «Control de flujo», estudia while y for y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica while y for con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B03-L04","title":"Patrones en condiciones","explanation":"En «Control de flujo», estudia patrones en condiciones y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica patrones en condiciones con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"let x = 7; let etiqueta = if x > 5 { \"alto\" } else { \"bajo\" }; println!(\"{etiqueta}\");","finalChallenge":"Resuelve un ejercicio de control de flujo y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B04","slug":"funciones","title":"Funciones","level":"basic","topics":["Parámetros","Retornos","Expresiones vs sentencias","Scope"],"lessons":[{"id":"B04-L01","title":"Parámetros","explanation":"En «Funciones», estudia parámetros y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica parámetros con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B04-L02","title":"Retornos","explanation":"En «Funciones», estudia retornos y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica retornos con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B04-L03","title":"Expresiones vs sentencias","explanation":"En «Funciones», estudia expresiones vs sentencias y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica expresiones vs sentencias con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B04-L04","title":"Scope","explanation":"En «Funciones», estudia scope y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica scope con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"fn doble(x: i32) -> i32 { x * 2 } fn main() { println!(\"{}\", doble(4)); }","finalChallenge":"Resuelve un ejercicio de funciones y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B05","slug":"ownership","title":"Ownership","level":"basic","topics":["Movimiento de valores","Copy y Clone","Drop","Transferencia a funciones"],"lessons":[{"id":"B05-L01","title":"Movimiento de valores","explanation":"En «Ownership», estudia movimiento de valores y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica movimiento de valores con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B05-L02","title":"Copy y Clone","explanation":"En «Ownership», estudia copy y clone y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica copy y clone con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B05-L03","title":"Drop","explanation":"En «Ownership», estudia drop y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica drop con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B05-L04","title":"Transferencia a funciones","explanation":"En «Ownership», estudia transferencia a funciones y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica transferencia a funciones con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"fn main() { let a = String::from(\"Ferris\"); let b = a; println!(\"{b}\"); }","finalChallenge":"Resuelve un ejercicio de ownership y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B06","slug":"borrowing","title":"Borrowing","level":"basic","topics":["Referencias inmutables","Referencias mutables","Conflictos de préstamo","Slices"],"lessons":[{"id":"B06-L01","title":"Referencias inmutables","explanation":"En «Borrowing», estudia referencias inmutables y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica referencias inmutables con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B06-L02","title":"Referencias mutables","explanation":"En «Borrowing», estudia referencias mutables y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica referencias mutables con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B06-L03","title":"Conflictos de préstamo","explanation":"En «Borrowing», estudia conflictos de préstamo y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica conflictos de préstamo con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B06-L04","title":"Slices","explanation":"En «Borrowing», estudia slices y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica slices con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"}],"code":"fn largo(s: &str) -> usize { s.len() } fn main() { let s = String::from(\"Rust\"); println!(\"{}\", largo(&s)); }","finalChallenge":"Resuelve un ejercicio de borrowing y justifica los resultados.","xp":30,"contentStatus":"outline","runtime":"playground-optional"},{"id":"B07","slug":"lifetimes-b-sicos","title":"Lifetimes básicos","level":"basic","topics":["Alcance de referencias","Dangling references","Elisión","Lectura de errores"],"lessons":[{"id":"B07-L01","title":"Alcance de referencias","explanation":"En «Lifetimes básicos», estudia alcance de referencias y reconoce sus implicaciones en la seguridad, la legibilidad y el comportamiento del programa. Contrasta el ejemplo con la documentación oficial y comprueba los casos límite.","practice":"Explica alcance de referencias con tus palabras y señala una situación en la que utilizarías esta técnica.","status":"editorial-outline"},{"id":"B07-L02","title":"Dangling references","explanation":"En «Lifetimes básicos», estudia dangling references y reconoce sus implicaciones en la s const labels=()=>t[pref.locale]||t.es;
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{notify('El navegador no pudo guardar el progreso.')}}

function image(name){return `public/assets/ferris/${name}.png`}
function link(view,label,extra=''){return `<button class="btn ${extra}" data-nav="${view}">${label}</button>`}
function statbar(n,d){return `<div class="meter" role="progressbar" aria-valuenow="${n}" aria-valuemax="${d}" aria-valuemin="0"><span style="width:${Math.max(0,Math.min(100,100*n/Math.max(1,d)))}%"></span></div>`}
function card(title,content){return `<section class="card"><h3>${title}</h3>${content}</section>`}
function counts(level){return modules.filter(m=>m.level===level).length}
function finish(id){if(!progress.completed.includes(id)){progress.completed.push(id);const m=modules.find(m=>m.id===id);progress.xp+=m.xp;progress.currentModule=id;if(progress.completed.length===1)progress.achievements.push('Primer módulo');save();notify(`${id} marcado como estudiado (+${m.xp} XP)`)}render()}
function notify(message){const el=q('#status');if(el){el.textContent=message;el.style.display='block';setTimeout(()=>{if(el.textContent===message)el.style.display='none'},4000)}}
function home(){const done=progress.completed.length;const last=modules.find(m=>m.id===progress.currentModule)||modules[0];return `<section class="hero"><img class="mascot bob mini-pixel" src="${image('explorer')}" alt="Ferris explorador naranja"/><div><div class="eyebrow">🦀 Rust Forge · Pixel Art Academy</div><h1><span style="color:#ff9c53">RustPixel</span><br/>Academy</h1><p>${esc(labels()[9])}</p><div class="actions">${link('learn','▶ '+labels()[7],'btn-primary')}<button class="btn" data-open="${last.id}">↗ ${labels()[8]} ${last.id}</button></div></div></section><div class="sectionhead"><h2>Ruta de aprendizaje</h2><span class="tag">54 módulos · 8 especializaciones</span></div><div class="grid4">${['basic','intermediate','advanced','senior'].map((l,i)=>card(['🌱 Rust Básico','📦 Rust Intermedio','⚙️ Rust Avanzado','👑 Senior Mode'][i],`<p>${counts(l)} módulos</p>${statbar(modules.filter(m=>m.level===l&&progress.completed.includes(m.id)).length,counts(l))}<button class="btn" data-nav="${l==='senior'?'senior':'learn'}" data-level="${l}">Explorar →</button>`)).join('')}</div><div class="sectionhead"><h2>Continúa tu aventura</h2></div><div class="grid3">${card('🧠 Ownership Visualizer',`<p>Visualiza movimientos de Strings y quién es el propietario de un valor.</p>${link('games','Explorar puzzle →')}`)}${card('👑 The Master Forge',`<p>18 módulos senior: Tokio, unsafe, rendimiento, seguridad y arquitectura.</p>${link('senior','Abrir Senior Mode →')}`)}${card('🏆 Tu progreso',`<div class="stat">${done} / 54</div>${statbar(done,54)}${link('progress','Ver logros →')}`)}</div>`}
function learn(){const list=modules.filter(m=>m.level===state.level&&`${m.id} ${m.title} ${m.topics.join(' ')}`.toLowerCase().includes(state.search.toLowerCase()));return `<div class="sectionhead"><h2>📖 Aprende Rust</h2><span class="tag">36 módulos + 18 Senior</span></div><p class="notice">Los 54 temarios existen, pero las 216 lecciones contienen esquemas editoriales iniciales, no cursos extensos ya terminados.</p><div class="actions">${[['basic','Básico'],['intermediate','Intermedio'],['advanced','Avanzado'],['senior','Senior']].map(([id,l])=>`<button class="btn ${id===state.level?'btn-primary':''}" data-level="${id}" aria-pressed="${id===state.level}">${l}</button>`).join('')}</div><label for="find" class="sr-only">Buscar módulos</label><input class="input" id="find" placeholder="Buscar módulos" value="${esc(state.search)}" style="margin:18px 0"/><div class="grid3">${list.map(m=>`<button class="card module" data-open="${m.id}"><span class="tag">${m.id}</span><h3>${esc(m.title)}</h3><p>${esc(m.topics.join(' · '))}</p><small>4 lecciones estructuradas</small>${statbar(progress.completed.includes(m.id)?1:0,1)}</button>`).join('')}</div>${list.length?'':'<p>Sin resultados.</p>'}`}
function moduleView(){const m=modules.find(m=>m.id===state.module);if(!m)return '<h2>Módulo no encontrado</h2>';const l=m.lessons[state.lesson]||m.lessons[0],code=progress.drafts[m.id]??m.code;return `<div class="sectionhead"><h2>${m.id} · ${esc(m.title)}</h2><span class="tag">${esc(m.level)}</span></div><p class="notice">Guion editorial inicial. No hay validación automática del código; "Marcar estudiado" es autoevaluación y no equivale a aprobar tests Cargo.</p><div class="lesson-layout">${card('📖 '+esc(l.title),`<p>${esc(l.explanation)}</p><div class="prompt">✍️ ${esc(l.practice)}</div><div class="actions">${m.lessons.map((a,i)=>`<button class="btn ${i===state.lesson?'btn-primary':''}" data-lesson="${i}" aria-pressed="${state.lesson===i}">${i+1}</button>`).join('')}</div><div class="actions"><button class="btn" data-lesson="${Math.max(0,state.lesson-1)}" ${state.lesson===0?'disabled':''}>← Anterior</button><button class="btn" data-lesson="${Math.min(3,state.lesson+1)}" ${state.lesson===3?'disabled':''}>Siguiente →</button></div><hr/><h3>🎯 Desafío final</h3><p>${esc(m.finalChallenge)}</p><button class="btn btn-gold" data-complete="${m.id}" ${progress.completed.includes(m.id)?'disabled':''}>${progress.completed.includes(m.id)?'✓ Estudiado':'Marcar como estudiado · +'+m.xp+' XP'}</button>`)}${card('⌨ Editor Rust',`<label class="sr-only" for="code">Código Rust editable</label><textarea id="code" class="input" spellcheck="false" style="font:13px/1.55 var(--font-code);min-height:280px;background:#0b1423;color:#e7edf5">${esc(code)}</textarea><div class="actions"><button class="btn btn-primary" id="playground">▶ Abrir Rust Playground ↗</button><button class="btn" id="reset-code">↻ Restaurar</button></div><p class="small">Abre un sitio externo para compilación real; la demo HTML no ejecuta rustc.</p>` )}</div>`}
function senior(){const senior=modules.filter(m=>m.level==='senior'),done=senior.filter(m=>progress.completed.includes(m.id)).length;const areas=[['🐞','Production Debugging','Investiga errores de memoria, locking y concurrencia'],['🚨','Incident Simulator','Logs y escenarios didácticos de producción'],['🔎','Code Review Senior','Evalúa refactor, cambios e invariantes'],['⚡','Performance Labs','Mediciones, allocations y profiling'],['🧱','System Design','Decisiones, consistencia y resiliencia'],['🛡️','Security & Unsafe','Safety contracts, FFI y autorización']];return `<section class="hero"><img class="mascot bob" src="${image('senior')}" alt="Ferris Senior con corona"/><div><div class="eyebrow">👑 THE MASTER FORGE</div><h1>Senior Mode</h1><p>18 módulos Rust profesionales con enfoque en arquitectura, seguridad, ingeniería de sistemas y debugging.</p><div class="actions"><button class="btn btn-gold" data-open="S01">Comenzar S01 →</button></div></div></section><div class="sectionhead"><h2>Ruta Senior · 18 módulos</h2><strong>${done}/18 estudiados</strong></div>${statbar(done,18)}<div class="grid3" style="margin-top:18px">${senior.map(m=>`<button class="card module" data-open="${m.id}"><span class="tag">${m.id}</span><h3>${esc(m.title)}</h3><p>${esc(m.topics.join(' · '))}</p><small>${progress.completed.includes(m.id)?'✓ Estudiado':'Pendiente'}</small></button>`).join('')}</div><div class="sectionhead"><h2>Áreas de retos Senior</h2></div><div class="grid3">${areas.map((a,i)=>card(`${a[0]} ${a[1]}`,`<p>${a[2]}</p><button class="btn" data-open="S${String(1+i*3).padStart(2,'0')}">Ver módulo →</button>`)).join('')}</div><div class="sectionhead"><h2>18 escenarios profesionales guiados</h2></div><div class="grid2">${seniorChallenges.map(c=>card(c.moduleId+' · '+esc(c.title),`<p><strong>Escenario:</strong> ${esc(c.scenario)}</p><p><strong>Objetivo:</strong> ${esc(c.mission)}</p><p class="small">Evidencia: ${esc(c.evidence.join(' · '))}</p><span class="tag">Revisión humana/Cargo · no evaluado automáticamente</span>`)).join('')}</div><div class="sectionhead"><h2>Rúbrica Senior</h2></div>${card('Evaluación orientativa',`<p>Corrección 30% · Seguridad y fiabilidad 25% · Arquitectura 20% · Rendimiento 15% · Explicación 10%.</p><p class="small">No hay calificación automatizada de producción; evidencia Cargo y revisión aún pendientes por reto.</p>`)}`}
function ecosystem(){return `<div class="sectionhead"><h2>🧱 Rust Ecosystem Academy</h2><span class="tag">8 rutas</span></div><p>Rutas de herramientas y frameworks del ecosistema. Las unidades son temario inicial y no laboratorios completos.</p><div class="grid2">${paths.map(p=>card(`${p.id} · ${esc(p.name)}`,`<p>${esc(p.description)}</p><ol>${p.units.map(u=>`<li>${esc(u)}</li>`).join('')}</ol><span class="tag">Edición pendiente</span>`)).join('')}</div>`}
function gamesView(){const g=games.map((item,i)=>card(['🧩','🎲','🏆','🔮','🐞','🧠','📦','🔒','⌛','⚙️','⚡','📈','🔎','🚨'][i]+' '+item.name,`<p>${item.availability==='interactive'?'Primera actividad interactiva o guiada disponible':'Modalidad planificada · sin implementación completa'}</p>`)).join('');const question=questions[state.question];return `<div class="sectionhead"><h2>🎮 Juegos y desafíos</h2><span class="tag">14 mecánicas catalogadas</span></div><div class="grid4">${g}</div><div class="sectionhead"><h2>Quiz Battle funcional</h2></div>${card('Pregunta '+(state.question+1)+' de '+questions.length,`<p><strong>${esc(question.question)}</strong></p><div class="choices">${question.options.map((a,i)=>`<button class="choice" data-answer="${i}" aria-pressed="${i===state.selected}">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div><div class="actions"><button class="btn btn-primary" id="check" ${state.selected<0?'disabled':''}>Comprobar respuesta</button><button class="btn" id="next-question">Siguiente →</button></div>${state.feedback===null?'':`<div class="feedback ${state.feedback?'ok':'no'}" role="status"><strong>${state.feedback?'✓ Correcto':'✗ Incorrecto'}</strong><p>${esc(question.explanation)}</p></div>`}`)}<div class="sectionhead"><h2>Ownership Puzzle interactivo</h2></div>${card('¿Quién posee el String?',`<div class="codebox"><pre>${esc(['let a = String::from("Ferris");','let b = a;','println!("{b}");'].slice(0,state.step+1).join('\n'))}</pre></div><p><strong>Propietario actual:</strong> ${state.step===0?'a':'b'}</p><p>${['a crea y posee el String.','b recibe el String por move; a deja de poder usarse.','b imprime su String válido.'][state.step]}</p><div class="actions"><button class="btn" id="prev-step">← Paso anterior</button><button class="btn btn-primary" id="next-step">Siguiente evento →</button></div><p class="small">Una representación guiada, no el borrow checker completo.</p>`)}`}
function progressPage(){const done=progress.completed.length;return `<div class="sectionhead"><h2>🏆 Mi progreso</h2></div><div class="grid3">${card('Módulos estudiados',`<div class="stat">${done} / 54</div>${statbar(done,54)}`)}${card('Experiencia local',`<div class="stat">${progress.xp} XP</div><p>XP obtenidos por autoevaluación.</p>`)}${card('Mis logros',`<div class="stat">${progress.achievements.length}</div><p>${esc(progress.achievements.join(', ')||'Completa tu primer módulo')}</p>`)}</div><div class="sectionhead"><h2>Respaldo local</h2></div>${card('Progreso y privacidad',`<p>Tus datos solo se almacenan en este navegador. Si se borran los datos del sitio, puedes perder el progreso.</p><div class="actions"><button class="btn btn-primary" id="export">⬇ Exportar progreso</button><button class="btn" id="import-trigger">⬆ Importar progreso</button><input type="file" id="import" class="sr-only" accept=".json,application/json"/></div><div id="import-status" aria-live="polite"></div>`)}`}
function settings(){return `<div class="sectionhead"><h2>⚙ Preferencias</h2></div>${card('Tema e idioma',`<div class="toggleline"><label for="locale">Idioma de interfaz</label><select id="locale" class="input" style="max-width:200px">${[['es','🇪🇸 Español'],['en','🇺🇸 English'],['ja','🇯🇵 日本語'],['zh-Hans','🇨🇳 简体中文'],['pt-BR','🇧🇷 Português'],['fr','🇫🇷 Français']].map(([code,label])=>`<option value="${code}" ${pref.locale===code?'selected':''}>${label}</option>`).join('')}</select></div><div class="toggleline"><span>Tema</span><div class="actions"><button class="btn ${pref.theme==='light'?'btn-primary':''}" data-theme="light">☀ Claro</button><button class="btn ${pref.theme==='dark'?'btn-primary':''}" data-theme="dark">☾ Oscuro</button></div></div><div class="toggleline"><label for="motion">Animaciones</label><input type="checkbox" id="motion" ${pref.motion?'checked':''}/></div><div class="toggleline"><label for="senior-enable">Senior Mode visible</label><input type="checkbox" id="senior-enable" ${pref.seniorEnabled?'checked':''}/></div><p class="small">Las explicaciones del curso todavía están en español y no se traducen automáticamente; solo la UI tiene seis diccionarios.</p>`)}`}
function render(){savePrefs();const l=labels();q('#header').innerHTML=`<a class="brand" href="#" data-nav="home"><img src="${image('explorer')}" alt=""/><span><b>RustPixel</b> Academy</span></a><nav class="nav" aria-label="Navegación principal">${[['home',l[0],'🏠'],['learn',l[1],'📖'],['senior',l[2],'👑'],['ecosystem',l[3],'🧱'],['games',l[4],'🎮'],['progress',l[5],'🏆']].filter(([v])=>v!=='senior'||pref.seniorEnabled).map(([v,n,e])=>`<button data-nav="${v}" class="${state.view===v?'selected':''}">${e} ${n}</button>`).join('')}<button data-nav="settings" aria-label="${l[6]}">⚙</button><button id="quick-theme" aria-label="Cambiar tema">${pref.theme==='dark'?'☀':'☾'}</button></nav>`;
 q('#sidebar').innerHTML=`<strong>🦀 Rutas de aprendizaje</strong><div style="height:13px"></div>${[['B01','🌱 Rust Básico'],['I01','📦 Rust Intermedio'],['A01','⚙️ Rust Avanzado'],['S01','👑 Senior Mode']].filter(([id])=>id!=='S01'||pref.seniorEnabled).map(([id,label])=>`<button class="btn" style="width:100%;margin:4px 0" data-open="${id}">${label}</button>`).join('')}<hr style="border-color:var(--border)"/><button class="btn" data-nav="ecosystem" style="width:100%">🧱 Ecosystem Academy</button><button class="btn" data-nav="games" style="width:100%;margin-top:7px">🎮 Juegos</button><img src="${image('engineer')}" alt="Ferris ingeniero" style="width:100%;height:160px;object-fit:contain;image-rendering:pixelated;margin-top:18px"/><p class="small">${progress.completed.length}/54 estudiados · ${progress.xp} XP</p>${statbar(progress.completed.length,54)}`;
 q('#main').innerHTML=({home,learn,module:moduleView,senior,ecosystem,games:gamesView,progress:progressPage,settings})[state.view]()+`<footer class="footer">RustPixel Academy · Prototipo HTML autónomo · No es Rust oficial ni compila Rust localmente · <a href="https://www.rust-lang.org/policies/media-guide" target="_blank" rel="noopener noreferrer">Guía de marca Rust</a></footer>`;document.title='RustPixel Academy · '+state.view;}
function nav(view){state.view=view;if(view==='learn')state.search='';location.hash='#/'+view;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-nav]');if(!target)return;let d=target.dataset;if(d.nav){if(d.level)state.level=d.level;nav(d.nav);return}if(d.level){state.level=d.level;render();return}if(d.open){state.module=d.open;state.lesson=0;nav('module');return}if(d.lesson!==undefined){state.lesson=+d.lesson;render();return}if(d.complete){finish(d.complete);return}if(d.answer!==undefined){state.selected=+d.answer;state.feedback=null;render();return}if(d.theme){pref.theme=d.theme;render();return}
switch(target.id){case 'quick-theme':pref.theme=pref.theme==='dark'?'light':'dark';render();break;case 'playground':{const params=new URLSearchParams({edition:'2024',code:q('#code').value});window.open('https://play.rust-lang.org/?'+params.toString(),'_blank','noopener,noreferrer');break}case 'reset-code':progress.drafts[state.module]=modules.find(m=>m.id===state.module).code;save();render();break;case 'check':{state.feedback=state.selected===questions[state.question].answer;if(state.feedback){progress.answers[questions[state.question].id]=state.selected;save()}render();break}case 'next-question':state.question=(state.question+1)%questions.length;state.selected=-1;state.feedback=null;render();break;case 'prev-step':state.step=(state.step+2)%3;render();break;case 'next-step':state.step=(state.step+1)%3;render();break;case 'export':{const blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='rustpixel-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'import-trigger':q('#import').click();break;}
});
document.addEventListener('input',e=>{if(e.target.id==='code'){progress.drafts[state.module]=e.target.value.slice(0,20000);save()}if(e.target.id==='find'){const text=e.target.value;state.search=text;const pos=e.target.selectionStart;render();q('#find')?.focus();q('#find')?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='locale'){pref.locale=e.target.value;render()}if(e.target.id==='motion'){pref.motion=e.target.checked;render()}if(e.target.id==='senior-enable'){pref.seniorEnabled=e.target.checked;render()}if(e.target.id==='import'){const f=e.target.files?.[0];if(!f)return;try{if(f.size>200000)throw Error('Archivo demasiado grande');const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.completed)||o.completed.some(id=>!modules.some(m=>m.id===id))||typeof o.xp!=='number'||o.xp<0||o.xp>1000000||!o.drafts||typeof o.drafts!=='object'||Array.isArray(o.drafts)||Object.entries(o.drafts).some(([key,v])=>typeof v!=='string'||v.length>20000)||!o.answers||typeof o.answers!=='object'||Array.isArray(o.answers))throw Error('Contenido inválido');progress={...empty,...o,completed:[...new Set(o.completed)]};save();render();notify('Progreso importado')}catch(err){notify('Error al importar: '+err.message)}}});
window.addEventListener('hashchange',()=>{const bits=location.hash.replace(/^#\/?/,'').split('/');if(['home','learn','senior','ecosystem','games','progress','settings'].includes(bits[0]))state.view=bits[0];else if(bits[0]==='module'&&modules.some(m=>m.id===bits[1])){state.view='module';state.module=bits[1]}render()});
const route=location.hash.replace(/^#\/?/,'').split('/');if(route[0]==='module'&&modules.some(m=>m.id===route[1])){state.view='module';state.module=route[1]}else if(['home','learn','senior','ecosystem','games','progress','settings'].includes(route[0]))state.view=route[0];render();
</script></body></html>
